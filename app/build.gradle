plugins { id 'com.android.application' }

android {
    namespace 'dev.icecam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.icecam.app'
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName '2.0.8-reference-natives'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    buildFeatures {
        prefab true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    // Reference ShadowHook 1.0.x ships in jniLibs as libshadowhook.so → deployed as /data/libvc++.so
}

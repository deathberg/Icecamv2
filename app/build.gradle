plugins { id 'com.android.application' }

android {
    namespace 'dev.icecam.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.icecam.app'
        minSdk 23
        targetSdk 35
        versionCode 27
        versionName '2.0.0-icecamv2'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
                targets 'vc'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    buildFeatures {
        prefab true
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so', '**/libshadowhook.so']
        }
    }
}

dependencies {
    implementation 'com.bytedance.android:shadowhook:2.0.0'
}

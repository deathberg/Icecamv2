plugins { id 'com.android.application' }

android {
    namespace 'dev.icecam.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.icecam.app'
        minSdk 29
        targetSdk 35
        versionCode 27
        versionName '0.27-v27-icecamv2'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions -Wall -Wextra'
                arguments '-DANDROID_STL=c++_shared'
                targets 'vc', 'vcplax'
            }
        }
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libshadowhook.so', '**/libshadowhook_nothing.so']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'com.bytedance.android:shadowhook:2.0.0'
}

// Package vcplax daemon executable as vcplax.so (original APK layout).
gradle.projectsEvaluated {
    android.applicationVariants.configureEach { variant ->
        def mergeTaskName = "merge${variant.name.capitalize()}NativeLibs"
        tasks.named(mergeTaskName).configure { mergeTask ->
            mergeTask.doLast {
                def outDirs = mergeTask.outputs.files.files
                def outDir = outDirs ? outDirs.iterator().next() : null
                if (outDir == null || !outDir.exists()) return
                def cxxRoot = file("${layout.buildDirectory.get()}/intermediates/cxx")
                if (!cxxRoot.exists()) return
                fileTree(cxxRoot).matching { include "**/vcplax" }.each { exec ->
                    ['arm64-v8a', 'armeabi-v7a'].each { abi ->
                        if (exec.absolutePath.contains(abi)) {
                            def destDir = new File(outDir, "lib/${abi}")
                            destDir.mkdirs()
                            copy {
                                from exec
                                into destDir
                                rename { 'vcplax.so' }
                            }
                        }
                    }
                }
            }
        }
    }
}

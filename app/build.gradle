plugins { id 'com.android.application' }

android {
    namespace 'dev.icecam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.icecam.app'
        minSdk 29
        targetSdk 35
        versionCode 27
        versionName '0.27-icecamv2-shadowhook2'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so', '**/libshadowhook.so']
        }
    }
}

dependencies {
    implementation 'com.bytedance.android:shadowhook:2.0.0'
}
